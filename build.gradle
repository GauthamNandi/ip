plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // Entry point the shadow JAR's manifest will point to (Main-Class),
    // so `java -jar` knows which class to run.
    mainClass = 'friday.Friday'
}

repositories {
    mavenCentral()
}

shadowJar {
    archiveBaseName.set('friday')
    archiveClassifier.set('')
    archiveVersion.set('')
}
